DEFAULT select
PROMPT 0

LABEL select
COM32 boot/syslinux/whichsys.c32
APPEND -pxe- pxe -sys- sys -iso- sys

LABEL sys
MENU LABEL GoldenGate OS (macOS 27 Golden Gate for Surface Laptop 5)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-surface
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-surface.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G mem_sleep_default=s2idle i915.enable_psr=1 quiet splash
