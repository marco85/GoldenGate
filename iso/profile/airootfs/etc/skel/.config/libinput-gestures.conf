# GoldenGate OS — 1:1 macOS 27 Multi-Touch Trackpad & Touchscreen Gestures
gesture swipe up 3      /usr/bin/goldengate-gesture-handler mission-control
gesture swipe up 4      /usr/bin/goldengate-gesture-handler mission-control
gesture swipe down 3    /usr/bin/goldengate-gesture-handler app-expose
gesture swipe down 4    /usr/bin/goldengate-gesture-handler app-expose
gesture swipe left 3    /usr/bin/goldengate-gesture-handler space-right
gesture swipe left 4    /usr/bin/goldengate-gesture-handler space-right
gesture swipe right 3   /usr/bin/goldengate-gesture-handler space-left
gesture swipe right 4   /usr/bin/goldengate-gesture-handler space-left
gesture pinch in 4      /usr/bin/goldengate-gesture-handler launchpad
gesture pinch out 4     /usr/bin/goldengate-gesture-handler show-desktop
