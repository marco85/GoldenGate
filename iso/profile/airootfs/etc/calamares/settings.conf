---
modules-search: [ local ]

instances:
- id:       goldengate
  module:   shellprocess
  config:   shellprocess-goldengate.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - initcpiocfg
  - initcpio
  - grubcfg
  - bootloader
  - shellprocess@goldengate
  - umount
- show:
  - finished

branding: goldengate
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
