---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - wheel
    - video
    - audio
    - input
    - uucp
    - storage
    - network
    - power
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    wheel
sudoersConfigureWithGroup: true
setRootPassword: true
doReusePassword: true
passwordRequirements:
    nonempty: true
    minLength: 4
allowWeakPasswords: true
allowWeakPasswordsDefault: true
userShell: /bin/bash
setHostname: EtcFile
writeHostsFile: true
presets:
    fullName:
        value: ""
        editable: true
    loginName:
        value: ""
        editable: true
