insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat
insmod udf
insmod all_video
insmod font
insmod gfxterm
insmod png

if loadfont "${prefix}/fonts/unicode.pf2" ; then
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

set default="goldengate-live"
set timeout=3
set timeout_style=menu

menuentry "GoldenGate OS (macOS 27 Golden Gate for Surface Laptop 5)" --class arch --class gnu-linux --class gnu --class os --id 'goldengate-live' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-surface archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n mem_sleep_default=s2idle i915.enable_psr=1 quiet splash
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux-surface.img
}

menuentry "GoldenGate OS (Safe Graphics / Diagnostics)" --class arch --class gnu-linux --class gnu --class os --id 'goldengate-safe' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-surface archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G nomodeset
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/x86_64/initramfs-linux-surface.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry 'Surface UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi
