name: build
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: 'Optional prior run artifact; accepted only if all image sources are unchanged'
        required: false
        type: string
  push:
    branches: [main]
    paths: ["iso/**", "tools/**", ".github/workflows/build.yml"]

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run Configuration & Subsystem Tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pytest python3-yaml
          python3 -m pytest -v iso/tests/test_config.py iso/tests/test_installer.py iso/tests/test_sharing.py

  iso:
    needs: verify-config
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free Runner Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build GoldenGate OS Arch ISO
        if: ${{ inputs.reuse_run_id == '' }}
        run: |
          docker run --rm --privileged -v "$PWD":/w -w /w archlinux:latest bash iso/build.sh
          sudo chown -R "$(id -u):$(id -g)" out
      - name: Reuse image only when its product sources match
        if: ${{ inputs.reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          [[ "$REUSE_RUN_ID" =~ ^[0-9]+$ ]]
          IMAGE_SHA=$(gh run view "$REUSE_RUN_ID" --json headSha --jq .headSha)
          git fetch origin "$IMAGE_SHA" --depth=1
          git diff --exit-code "$IMAGE_SHA" HEAD -- iso/profile iso/build.sh iso/build-pear-dock.sh iso/patches
          gh run download "$REUSE_RUN_ID" --name goldengate-iso --dir out
          rm -f out/boot-test.log
      - name: Verify ISO Image & FAT32 / 16GB USB Size Constraints
        run: |
          python3 iso/tests/test_image.py
      - name: Verify UEFI boot and offline installation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf python3-pexpect squashfs-tools xorriso
          sudo chmod 666 /dev/kvm
          python3 iso/tests/verify_contents.py
          python3 iso/tests/boot_check.py
      - name: Publish ISO to GitHub Release (Chunked <1.9GB for GitHub Release Limit & Zero Quota)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          ISO_FILE=$(ls -t *.iso | head -n 1)
          sha256sum "$ISO_FILE" > "${ISO_FILE}.sha256"
          split -b 1900m "$ISO_FILE" "${ISO_FILE}.part-"
          if gh release view v27.0-latest >/dev/null 2>&1; then
            gh release delete v27.0-latest -y --cleanup-tag || true
          fi
          gh release create v27.0-latest "${ISO_FILE}.sha256" "${ISO_FILE}.part-"* \
            --title "GoldenGate OS 27.0 (macOS 27 Golden Gate for Surface Laptop 5)" \
            --notes "Automated Arch Linux + KDE Plasma 6 Wayland + linux-surface + Antigravity v2.24.0 ISO build ($ISO_FILE)."
          rm -f "${ISO_FILE}.part-"*
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: goldengate-iso
          path: |
            out/*.iso
            out/boot-test.log
          retention-days: 5
          compression-level: 0
